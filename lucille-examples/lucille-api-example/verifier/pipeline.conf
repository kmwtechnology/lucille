# Lucille config the verifier uploads to the API via POST /v1/config.
# Paths are resolved inside the API container, where ./conf is mounted at /conf.
connectors: [
  {
    class: "com.kmwllc.lucille.connector.FileConnector"
    name: "csv_connector"
    pipeline: "simple_pipeline"
    paths: ["/conf/source.csv"]
    fileHandlers: {
      csv { }
    }
  }
]

pipelines: [
  {
    name: "simple_pipeline"
    stages: [
      {
        class: "com.kmwllc.lucille.stage.RenameFields"
        fieldMapping {
          "name" : "my_name"
        }
      }
    ]
  }
]

indexer {
  type: "CSV"
}

csv {
  columns: ["id", "my_name", "price", "country"]
  path: "/tmp/api-example-output.csv"
  includeHeader: false
}
