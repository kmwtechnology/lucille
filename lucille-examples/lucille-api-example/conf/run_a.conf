# Lucille config the runner (IngestDriver) uploads to the API as HOCON via POST /v1/config. It is run concurrently with
# run_b.json, which is uploaded as JSON and is otherwise identical except for its doc ID prefix, "run" value,
# and output path, so the verifier can tell whether documents from one run ended up in the other's output.
connectors: [
  {
    class: "com.kmwllc.lucille.connector.SequenceConnector"
    name: "sequence_connector"
    pipeline: "simple_pipeline"
    numDocs: 500
    docIdPrefix: "a-"
  }
]

# For a doc with id "a-7", the indexed fields end up as:
#   id: "a-7", run: "a", num: "7", run_label: "a:a-7", and no "scratch" field
pipelines: [
  {
    name: "simple_pipeline"
    stages: [
      {
        class: "com.kmwllc.lucille.stage.SetStaticValues"
        staticValues {
          "run" : "a"
          "scratch" : "to be deleted"
        }
      }
      {
        class: "com.kmwllc.lucille.stage.CopyFields"
        fieldMapping {
          "id" : "num"
        }
      }
      {
        # strips the "a-" prefix, leaving the sequence number
        class: "com.kmwllc.lucille.stage.ReplacePatterns"
        source: ["num"]
        dest: ["num"]
        regex: ["^[a-z]+-"]
        replacement: ""
      }
      {
        class: "com.kmwllc.lucille.stage.Concatenate"
        dest: "label"
        formatString: "{run}:{id}"
      }
      {
        class: "com.kmwllc.lucille.stage.RenameFields"
        fieldMapping {
          "label" : "run_label"
        }
      }
      {
        class: "com.kmwllc.lucille.stage.DeleteFields"
        fields: ["scratch"]
      }
    ]
  }
]

indexer {
  type: "CSV"
}

# /output is a volume shared with the verifier container, which checks this file in VerifyIngestResult
csv {
  columns: ["id", "run", "num", "run_label", "scratch"]
  path: "/output/run_a.csv"
  includeHeader: false
}
