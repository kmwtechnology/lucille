name: lucille-api-example

# The runner and verifier both run classes from the example's test classes, so they share one image, built
# from verifier/Dockerfile. Needs the example's target/ (test classes and verifier-lib), built by `mvn package`.
x-example-classes: &example-classes
  build:
    context: .
    dockerfile: ./verifier/Dockerfile
  image: lucille-api-example-classes:api-example
  networks:
    - lucille-net

services:
  # One-shot init container: a fresh named volume is owned by root, but the API image runs as the
  # non-root "lucille" user, so open up the output volume before the API writes to it.
  output-init:
    image: alpine:3.20
    command: ["chmod", "777", "/output"]
    volumes:
      - output:/output

  # Built from the same Dockerfile that release-to-docker.yml publishes as kmwtechnology/lucille-api.
  # Requires target/lucille-api-plugin.jar, built with `mvn clean install -Pshaded-plugin-jars`.
  api:
    build:
      context: ../../lucille-plugins/lucille-api
      dockerfile: Dockerfile
    image: lucille-api:api-example
    depends_on:
      output-init:
        condition: service_completed_successfully
    environment:
      DROPWIZARD_CONF: /conf/api.yml
    volumes:
      - ./conf:/conf:ro
      - output:/output
    ports:
      - 8080:8080
    networks:
      - lucille-net
    # The container starts well before Dropwizard is serving requests, so the verifier waits on this.
    # Requires exactly 200 from the readiness probe, the same as VerifyApiEndpoints does, rather than any
    # non-error status. The image is based on eclipse-temurin, which includes curl. ($$ escapes $ for compose.)
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/readyz)\" = 200 ]"]
      interval: 2s
      timeout: 5s
      retries: 60

  # Runs IngestDriver: uploads ./conf/run_a.conf (as HOCON) and ./conf/run_b.json (as JSON) to the API, starts both runs at once,
  # and exits non-zero if an upload or run fails.
  runner:
    <<: *example-classes
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["java", "-cp", "/verifier/classes:/verifier/lib/*", "com.kmwllc.lucille.api.IngestDriver"]
    volumes:
      - ./conf:/conf:ro

  # Runs VerifyApiEndpoints against the API, and VerifyIngestResult against the CSVs the runs wrote to the
  # shared output volume. Exits non-zero if any check fails.
  verifier:
    <<: *example-classes
    depends_on:
      runner:
        condition: service_completed_successfully
    entrypoint: ["java", "-cp", "/verifier/classes:/verifier/lib/*", "org.junit.runner.JUnitCore",
                 "com.kmwllc.lucille.api.VerifyApiEndpoints", "com.kmwllc.lucille.api.VerifyIngestResult"]
    volumes:
      - output:/output:ro

networks:
  lucille-net:

volumes:
  output:
