# Indexes conf/documents.csv into PostgreSQL with pgvector, through the DatabaseIndexer.
# Run from the lucille-postgres-vector-example directory; see README.md.

connectors: [
  {
    name: "csv_connector"
    class: "com.kmwllc.lucille.connector.FileConnector"
    pipeline: "pipeline1"
    paths: ["conf/documents.csv"]
    fileHandlers: {
      csv: {
        idField: "id"
      }
    }
  }
]

pipelines: [
  {
    name: "pipeline1"
    stages: [
      # The sample data carries its embeddings as JSON text; ParseFloats turns them into a list of floats, which is what an
      # embedding stage such as EmbedTextOpenAI produces. See README.md for using EmbedTextOpenAI instead.
      {
        name: "parseEmbedding"
        class: "com.kmwllc.lucille.stage.ParseFloats"
        source: "embedding"
        dest: "embeddings"
      }
      {
        name: "splitTags"
        class: "com.kmwllc.lucille.stage.SplitFieldValues"
        source: "tags"
        dest: "tags"
        delimiter: "\\|"
        trimWhitespace: true
      }
    ]
  }
]

indexer {
  batchSize: 100
  batchTimeoutMs: 1000

  # documents whose "deleted" field is "true" are deleted with deleteSql instead of written
  deletionMarker {
    field: "deleted"
    value: "true"
  }

  database {
    driver: "org.postgresql.Driver"
    # reWriteBatchedInserts lets the driver send a batch as multi-row statements
    connectionString: "jdbc:postgresql://localhost:5432/lucille?reWriteBatchedInserts=true"
    connectionString: ${?PG_CONNECTION_STRING}
    jdbcUser: "lucille"
    jdbcUser: ${?PG_USER}
    jdbcPassword: "lucille"
    jdbcPassword: ${?PG_PASSWORD}

    # An upsert, so re-running the ingest (or a retried batch) updates rows instead of failing on duplicate ids.
    # meta is JSON text in the CSV, so it is bound as a string and cast; embeddings is a list of floats, which the json
    # format writes as [0.92,0.05,...], pgvector's text format.
    sql: """
      INSERT INTO documents (id, title, body, meta, tags, embedding)
      VALUES (?, ?, ?, ?::jsonb, ?, ?::vector)
      ON CONFLICT (id) DO UPDATE SET
        title = EXCLUDED.title, body = EXCLUDED.body, meta = EXCLUDED.meta,
        tags = EXCLUDED.tags, embedding = EXCLUDED.embedding, updated_at = now()
    """
    params: [
      { field: "id" }
      { field: "title" }
      { field: "body" }
      { field: "meta" }
      { field: "tags", format: "array", arrayType: "text" }
      { field: "embeddings", format: "json" }
    ]

    deleteSql: "DELETE FROM documents WHERE id = ?"

    # fails the run at startup if the table or its columns are missing
    validationSql: "SELECT id, title, body, meta, tags, embedding FROM documents LIMIT 0"
  }
}
