// One config for the -external runs. scripts/run-nightly.sh sets INPUT_CSV to the input and OUTPUT_CSV to the file the
// indexer writes. The CSV's id column is the document id, so the verifier knows exactly which ids to expect.
connectors: [
  {
    name: "smokeConnector"
    class: "com.kmwllc.lucille.connector.FileConnector"
    pipeline: "pipeline1"
    paths: [${?INPUT_CSV}]
    fileHandlers: {csv: {idField: "id"}}
  }
]

pipelines: [
  {
    name: "pipeline1"
    stages: []
  }
]

kafka {
  # the three brokers' EXTERNAL listeners, on the host (see docker-compose.yml)
  bootstrapServers: "localhost:19092,localhost:19093,localhost:19094"
  bootstrapServers: ${?KAFKA_BOOTSTRAP_SERVERS}
  consumerGroupId: "lucille_multibroker_smoke"
  maxPollIntervalSecs: 600
  maxRequestSize: 250000000
  documentSerializer: "com.kmwllc.lucille.message.KafkaDocumentSerializer"
  documentDeserializer: "com.kmwllc.lucille.message.KafkaDocumentDeserializer"
  events: true

  # the event topic is created by Lucille, so it gets the same durability as the other topics: replicated to all three
  # brokers, with acks=all writes that need two in-sync replicas.
  eventTopicReplicationFactor: 3
  eventTopicMinInsyncReplicas: 2
  producer {
    acks: "all"
  }
}

indexer {
  csv {
    columns: ["id", "group", "body"]
    path: "output/dest.csv"
    path: ${?OUTPUT_CSV}
    includeHeader: false
  }
}

worker {
  pipeline: "pipeline1"
  threads: 2
}
