# Tika extracts flat text from every file; only PDFs are also sent to Docling, which keeps reading order,
# section headings and table structure. The output CSV puts both side by side for comparison.
#
# run from the lucille-docling-example directory: ExternalPython resolves its script and venv relative to the cwd.

connectors: [
  {
    name: "fileConnector"
    class: "com.kmwllc.lucille.connector.FileConnector"
    pipeline: "docling_pipeline"
    # sample data isn't checked in yet; put input files here
    paths: ["data"]
    # Docling reads from file_path; skipping the bytes keeps them out of the JSON sent to Python
    fileOptions {
      getFileContent: false
    }
  }
]

pipelines: [
  {
    name: "docling_pipeline"
    stages: [
      {
        name: "parseFilePath"
        class: "com.kmwllc.lucille.stage.ParseFilePath"
      },
      {
        name: "tika"
        class: "com.kmwllc.lucille.tika.stage.TextExtractor"
        filePathField: "file_path"
        textField: "tika_text"
        metadataPrefix: "tika_"
      },
      {
        name: "docling"
        class: "com.kmwllc.lucille.stage.ExternalPython"
        scriptPath: "src/main/resources/docling_extract.py"
        requirementsPath: "src/main/resources/requirements.txt"
        # script options are environment variables listed at the top of docling_extract.py, e.g. DOCLING_CHUNK=true
        # to add chunks, sized for the downstream embedding model via DOCLING_CHUNK_TOKENIZER / DOCLING_CHUNK_MAX_TOKENS

        # ParseFilePath uppercases extensions by default
        conditions: [
          { fields: ["file_extension"], values: ["PDF"] }
        ]
      }
    ]
  }
]

indexer {
  type: "CSV"
}

# docling_tables and docling_chunks are nested JSON, which the CSV indexer can't render; the tables also appear
# inside docling_markdown
csv {
  columns: ["file_path", "docling_tables_count", "docling_chunks_count", "tika_text", "docling_markdown"]
  path: "output/docling-example.csv"
}
