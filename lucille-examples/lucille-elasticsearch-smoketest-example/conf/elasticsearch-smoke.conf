// One config for all three runs. scripts/run-nightly.sh sets INPUT_CSV to the run's CSV (data/ingest.csv, then
// data/delete_by_id.csv, then data/delete_by_query.csv). The CSV's id column is the document id, so ids are known to the verifier.
connectors: [
  {
    name: "smokeConnector"
    class: "com.kmwllc.lucille.connector.FileConnector"
    pipeline: "pipeline1"
    paths: [${?INPUT_CSV}]
    fileHandlers: {csv: {idField: "id"}}
  }
]

pipelines: [
  {
    name: "pipeline1"
    stages: []
  }
]

indexer {
  type: "Elasticsearch"
  batchSize: 4
  batchTimeoutMs: 1000
  sendEnabled: true

  # a document with deleted=true is removed from the index instead of indexed. If it also carries queryField and
  # queryValue, every document whose queryField equals queryValue is removed (delete by query). Otherwise only its id is.
  deletionMarker {
    field: "deleted"
    value: "true"
  }
  deleteByQuery {
    fieldNameField: "queryField"
    valueField: "queryValue"
  }

  elasticsearch {
    url: "http://localhost:9200"
    url: ${?ELASTICSEARCH_URL}
    index: "smoke-test"
    index: ${?ELASTICSEARCH_INDEX}
  }
}

worker {
  pipeline: "pipeline1"
  threads: 1
}
