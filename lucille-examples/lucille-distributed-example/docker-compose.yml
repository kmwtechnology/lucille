name: distributed-lucille
services:
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    ports:
      - 9092:9092
    networks:
      - lucille-net
    volumes:
      - ./kafka/server.properties:/mnt/shared/config/server.properties
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server=kafka:9092", "--list"]
  runner:
    build:
      context: .
      dockerfile: ./runner/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      indexer:
        condition: service_healthy
    networks: 
      - lucille-net
  worker:
    build:
      context: .
      dockerfile: ./worker/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    networks: 
      - lucille-net
  indexer: 
    build:
      context: .
      dockerfile: ./indexer/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      solr:
        condition: service_healthy
    networks: 
      - lucille-net
  solr:
    image: solr:10.0.0
    container_name: solr
    ports:
      - 8983:8983
      - 9983:9983
    command: ["--host", "solr"]
    networks:
      - lucille-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/api/node/health"]
networks:
  lucille-net:
