// Crawl Contact from a Salesforce Developer Edition org and index each record in OpenSearch.
//
// clientId and clientSecret come from the environment. Append the security token to the password when the org requires one.
//   SALESFORCE_CLIENT_ID
//   SALESFORCE_CLIENT_SECRET
//
// From this example directory, after packaging (see README.md):
//   java -Dlog4j2.configurationFile=classpath:lucille-log4j2.xml -Dconfig.file=conf/contacts.conf -cp "target/lib/*" com.kmwllc.lucille.core.Runner

connectors: [
  {
    name: "salesforce-contacts"
    class: "com.kmwllc.lucille.salesforce.connector.SalesforceConnector"
    pipeline: "contacts"
    docIdPrefix: "sf-"
    clientId: ${SALESFORCE_CLIENT_ID}
    clientSecret: ${SALESFORCE_CLIENT_SECRET}
    username: ${SALESFORCE_USERNAME}
    password: ${SALESFORCE_PASSWORD}
    sobjects: ["Contact"]
  }
]

pipelines: [
  {
    name: "contacts"
    stages: []
  }
]

indexer {
  # The IDE compiler does not run AutoService, so indexer.opensearch is not registered.
  # Name the class directly. The nested opensearch block is still its settings.
  class: "com.kmwllc.lucille.opensearch.indexer.OpenSearchIndexer"

  batchSize: 500
  batchTimeoutMs: 1000
  sendEnabled: true

  opensearch {
    url: ${?OPENSEARCH_URL}
    index: ${?OPENSEARCH_INDEX}
    # Local OpenSearch uses a certificate that is not signed by a public CA.
    acceptInvalidCert: true
  }
}

worker {
  pipeline: "contacts"
  threads: 1
}
