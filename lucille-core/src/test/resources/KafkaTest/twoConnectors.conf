connectors: [
  {
    class: "com.kmwllc.lucille.connector.CSVConnector",
    path: "classpath:RunnerTest/threeDocsOneFailure.csv",
    idField: "id",
    name: "connector1",
    pipeline: "pipeline1"
  },
  {
    class: "com.kmwllc.lucille.connector.CSVConnector",
    path: "classpath:RunnerTest/singleDoc2.csv",
    name: "connector2",
    idField: "id",
    pipeline: "pipeline2"
  },
]

pipelines: [
  {
    name: "pipeline1",
    stages: [
      {
        class: "com.kmwllc.lucille.stage.NopStage"
      }
    ]
  },
  {
    name: "pipeline2",
    stages: [
      {
        class: "com.kmwllc.lucille.stage.NopStage"
      }
    ]
  }
]

solr {
  url: ["http://localhost:null"]
}

indexer {
  sendEnabled: false
  type: "solr"
}

kafka {
  bootstrapServers: "localhost:9090"

  # maximum time allowed between kafka polls before consumer is evicted from consumer group
  maxPollIntervalSecs: 600 # 10 minutes

  # ID of consumer group that all com.kmwllc.lucille workers should belong to
  consumerGroupId: "lucille_workers"

  maxRequestSize: 250000000

  # keep idle polls short so end-of-run detection and shutdown don't wait out the 2s production default
  pollIntervalMs: 100

  # just checking there are no snags with "other parent" validation when arbitrary properties are introduced
  consumer: {
    # heartbeat often so consumers notice group rebalances quickly (client default is 3s)
    heartbeat.interval.ms: 100
    something: "aString"
  }

  producer: {
    somethingElse: 123
  }
}
