indexer {
  deletionMarker {
    field: "deleted"
    value: "true"
  }
  jdbc {
    driver: "org.h2.Driver"
    connectionString: "jdbc:h2:mem:test"
    jdbcUser: ""
    jdbcPassword: ""
    sql: "MERGE INTO docs (id, title, n, meta, tags, ts) KEY (id) VALUES (?, ?, ?, ? FORMAT JSON, ?, ?)"
    params: [
      { field: "id" }
      { field: "title" }
      { field: "n", sqlType: "INTEGER" }
      { field: "meta", format: "json" }
      { field: "tags", format: "array", arrayType: "VARCHAR" }
      { field: "ts", format: "timestamp" }
    ]
    deleteSql: "DELETE FROM docs WHERE id = ?"
    validateSql: "SELECT id FROM docs LIMIT 0"
  }
}
