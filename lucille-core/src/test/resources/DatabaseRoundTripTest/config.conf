# Copies the source table to the target table: the DatabaseConnector reads each row as a document, and the
# DatabaseIndexer writes it back.
connectors: [
  {
    name: "database"
    class: "com.kmwllc.lucille.connector.jdbc.DatabaseConnector"
    pipeline: "copy"
    driver: "org.h2.Driver"
    connectionString: "jdbc:h2:mem:test"
    jdbcUser: ""
    jdbcPassword: ""
    sql: "SELECT * FROM source ORDER BY id"
    idField: "id"
  }
]

pipelines: [
  {
    name: "copy"
    stages: []
  }
]

indexer {
  # the 100 rows are sent in batches of at most 10, each in its own transaction
  batchSize: 10

  database {
    driver: "org.h2.Driver"
    connectionString: "jdbc:h2:mem:test"
    jdbcUser: ""
    jdbcPassword: ""
    sql: """
      INSERT INTO target (id, title, quantity, big, price, ratio, score, active, created, birthday, alarm, payload, notes)
      VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
    """
    # the connector writes TIMESTAMP and DATE columns as instants, and binary columns as bytes
    params: [
      { field: "id" }
      { field: "title" }
      { field: "quantity" }
      { field: "big" }
      { field: "price" }
      { field: "ratio" }
      { field: "score" }
      { field: "active" }
      { field: "created", format: "timestamp" }
      { field: "birthday", format: "timestamp" }
      { field: "alarm" }
      { field: "payload", format: "bytes" }
      { field: "notes" }
    ]
  }
}
