connectors: [
  {
    name: "connector1",
    class: "com.kmwllc.lucille.connector.FileConnector",
    pipeline: "pipeline1",
    paths: ["src/test/resources/RunnerTest/singleDoc.csv"]
    fileHandlers: {csv: {idField: "id"}},
  }
  {
    name: "connector2",
    class: "com.kmwllc.lucille.connector.FileConnector",
    pipeline: "pipeline1",
    paths: ["src/test/resources/RunnerTest/singleDoc.csv"]
    fileHandlers: {csv: {idField: "id"}},
  }
]

pipelines: [
  {
    name: "pipeline1",
    stages: [
      {
        class: "com.kmwllc.lucille.stage.NopStage",
        invalidProperty: true
      },
      {
        class: "com.kmwllc.lucille.stage.NopStage",
        conditions = [
          {
            values = ["MA", "1234", "US", "Russia", "4567"]
            operator = "must_not"
          },
          {
            fields = ["user_id", "state", "country"]
            values = ["MA", "1234", "US", "Russia", "4567"]
            operator2 = "must_not"
          }
        ]
      }
    ]
  }
]

indexer.type: "Nop"
