pipelines: [
  {
    name: "my-pipeline"
    stages: [
      {
        name: "PrintEnabled"
        class: "com.kmwllc.lucille.stage.Print"
      }
      {
        name: "TimestampDisabled"
        class: "com.kmwllc.lucille.stage.Timestamp"
        enabled: false
        destField: "time"
      }
      {
        name: "TimestampEnabled"
        class: "com.kmwllc.lucille.stage.Timestamp"
        enabled: true
        destField: "time"
      }
    ]
  }
]