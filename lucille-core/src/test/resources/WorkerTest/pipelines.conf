pipelines: [
  {name: "nop", stages: [{class: "com.kmwllc.lucille.stage.NopStage"}]},
  {name: "stackOverflowForDoc1", stages: [
    {class: "com.kmwllc.lucille.stage.ThrowingStage", throwable: "java.lang.StackOverflowError", onlyForIds: ["doc1"]}
  ]},
  {name: "outOfMemory", stages: [
    {class: "com.kmwllc.lucille.stage.ThrowingStage", throwable: "java.lang.OutOfMemoryError"}
