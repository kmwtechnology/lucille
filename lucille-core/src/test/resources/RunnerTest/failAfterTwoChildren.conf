connectors: [
  {
    name: "connector1",
    class: "com.kmwllc.lucille.connector.FileConnector",
    paths: ["src/test/resources/RunnerTest/singleDoc.csv"]
    fileHandlers: {csv: {idField: "id"}},
    pipeline: "pipeline1"
  }
]

pipelines: [
  {
    name: "pipeline1",
    stages: [
      {class: "com.kmwllc.lucille.stage.CreateChildrenStage",
       numChildren: 5,
       failAfter: 2,
       dropParent: true}
    ]
  }
]

indexer: {
  type: "Nop"
}