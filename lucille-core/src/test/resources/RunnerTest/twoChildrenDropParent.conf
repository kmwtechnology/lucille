connectors: [
  {
    name: "connector1",
    class: "com.kmwllc.lucille.connector.FileConnector",
    paths: ["src/test/resources/RunnerTest/singleDoc.csv"]
    fileHandlers: {csv: {idField: "id"}},
    pipeline: "pipeline1"
  }
]

pipelines: [
  {
    name: "pipeline1",
    stages: [
      {class = "com.kmwllc.lucille.stage.SetStaticValues"
       staticValues { before = "true" }},

      {class: "com.kmwllc.lucille.stage.CreateChildrenStage",
       numChildren: 2,
       dropParent: true},

       {class = "com.kmwllc.lucille.stage.SetStaticValues"
        staticValues { after1 = "true" }},

       {class = "com.kmwllc.lucille.stage.SetStaticValues"
        staticValues { after2 = "true" }}
    ]
  }
]

indexer: {
  type: "Nop"
}