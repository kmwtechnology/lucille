indexer {
  type : "OpenSearch"
  batchSize : 2
  batchTimeoutMs : 1000
  deletionMarker.field: "deleted"
  deletionMarker.value: "true"
  deleteByQuery.fieldNameField: "field"
  deleteByQuery.valueField: "value"
  sendEnabled: false

  opensearch {
    url: "http://localhost:9200"
    index: "lucille-default"
  }
}
