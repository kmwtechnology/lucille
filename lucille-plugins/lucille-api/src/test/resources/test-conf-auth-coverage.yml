server:
  type: default
  # ephemeral ports, so test classes running concurrently (surefire forks, other builds) don't collide
  applicationConnectors:
    - type: http
      port: 0
  adminConnectors:
    - type: http
      port: 0
  requestLog:
    type: external
logging:
  type: external

auth:
  type: "basicAuth"
  enabled: true
  password: "password"

swagger:
  resourcePackage: "com.kmwllc.lucille.endpoints"
  title: Lucille API
  description: Lucille API
  version: 0.0.1
  contact: info@kmwllc.com
  license: Apache 2.0
  securityDefinitions:
    basicAuth:
      type: "basic"
  security:
    - basicAuth: []
