indexer {
  type: "Elasticsearch"

  # not a necessary setting. meant to demonstrate that routing will be set even though it is in the blacklist
  excludeFields: [
    "id"
    "routing"
  ]

  batchSize: 1
  batchTimeoutMs: 1000
  sendEnabled: false

  elasticsearch {
    url: "http://localhost:9200"
    index: "lucille-default"
    update: true
    routingField: "routing"
  }
}
