indexer {
  type : "Elasticsearch"
  batchSize : 2
  batchTimeoutMs : 1000
  deletionMarkerField: "deleted"
  deletionMarkerFieldValue: "true"
  deleteByFieldField: "field"
  deleteByFieldValue: "value"
  sendEnabled: false

  elasticsearch {
    url: "http://localhost:9200"
    index: "lucille-default"
  }
}
