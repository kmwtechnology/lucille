connectors: [
  {
    name: "connector1",
    class: "com.kmwllc.lucille.connector.FileConnector",
    pipeline: "pipeline1",
    paths: ["src/test/resources/ElasticsearchConfigValidationTest/singleDoc.csv"],
    fileHandlers: {
      csv: { idField: "id" }
    }
  }
]

pipelines: [
  {
    name: "pipeline1",
    stages: [
      {
        class: "com.kmwllc.lucille.stage.NopStage",
      }
    ]
  }
]

indexer {
  type : "Elasticsearch"
  batchSize : 1
  batchTimeout : 1000
}

elasticsearch {
  # missing required property index
  url: "http://localhost:9200"
  # this property is supposed to be in "indexer", not in specific implementations
  sendEnabled: false
}
