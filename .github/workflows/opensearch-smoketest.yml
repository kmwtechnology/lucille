name: OpenSearch Smoke Test

# Runs lucille-opensearch-smoketest-example against a single-node OpenSearch in Docker: bulk indexing, delete by id, and
# delete by query. Scheduled with the other nightly smoke tests, and runnable by hand.

on:
  # TEMPORARY, for validating this branch before the workflow is on main. Remove before merging.
  push:
    branches: [ "LC-1005-smoketests" ]
  schedule:
    # runs at 00:00 UTC every day, 20:00 EST
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  opensearch-smoketest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # The script runs the example's jars and compiled verifiers from target/, so build them first.
      - name: Build the example and its dependencies (skip unit tests)
        run: mvn -B -pl lucille-examples/lucille-opensearch-smoketest-example -am package -DskipTests --file pom.xml
      - name: Run the OpenSearch smoke test
        run: ./lucille-examples/lucille-opensearch-smoketest-example/scripts/run-nightly.sh
