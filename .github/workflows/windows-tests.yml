# Temporary workflow for investigating Windows-specific test failures.
# Runs the full build (all modules, unit and integration tests) on a Windows runner.

name: Windows Tests

on:
  push:
    branches: [ "LC-629-handling-of-different-file-path-separators-across-different-operating-systems" ]

jobs:
  test:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B verify "-Dmaven.test.failure.ignore=true" --file pom.xml

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-windows
        path: |
          **/target/surefire-reports/
          **/target/failsafe-reports/
