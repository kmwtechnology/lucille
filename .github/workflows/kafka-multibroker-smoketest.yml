name: Multi-Broker Kafka Smoke Test

# Runs lucille-kafka-multibroker-smoketest-example against a three-broker Kafka cluster in Docker: a full external-mode run,
# then a run in which one broker is stopped mid-run. Scheduled with the other nightly smoke tests, and runnable by hand.

on:
  # TEMPORARY, for validating this branch before the workflow is on main. Remove before merging.
  push:
    branches: [ "LC-1005-smoketests" ]
  schedule:
    # runs at 00:00 UTC every day, 20:00 EST
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  kafka-multibroker-smoketest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # The script runs the example's jars and compiled verifier from target/, so build them first.
      - name: Build the example and its dependencies (skip unit tests)
        run: mvn -B -pl lucille-examples/lucille-kafka-multibroker-smoketest-example -am package -DskipTests --file pom.xml
      - name: Run the multi-broker Kafka smoke test
        run: ./lucille-examples/lucille-kafka-multibroker-smoketest-example/scripts/run-nightly.sh
