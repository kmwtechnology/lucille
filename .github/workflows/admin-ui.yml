# Builds and tests the admin UI independently of the Java build (no JDK/Maven).
# No `paths:` filter: a skipped run would leave a required check missing and block merges.
name: Admin UI CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

defaults:
  run:
    working-directory: lucille-plugins/lucille-api/lucille-admin-ui

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Must match node.version in the UI pom and .nvmrc.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
          cache: npm
          cache-dependency-path: lucille-plugins/lucille-api/lucille-admin-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (non-blocking)
        run: npm run audit:report

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
